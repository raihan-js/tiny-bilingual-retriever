[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyrerank"
version = "0.1.0"
description = "Tiny bilingual retriever: distill bge-m3 into a 30M JA-EN encoder"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "sentence-transformers>=3.0",
    "datasets>=2.18",
]

[project.optional-dependencies]
bm25 = ["fugashi>=1.3", "unidic-lite>=1.0.8", "bm25s>=0.2.0"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]